[project]
name = "pi-sessions-tui"
version = "0.1.0"
description = "Terminal UI for browsing, previewing, resuming and managing pi coding agent sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Psychobarge" },
    { name = "Marek Miśkiewicz" },  # ccsessions, which this is based on
]
keywords = ["pi", "pi-coding-agent", "sessions", "tui", "textual", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.80",
]

[project.urls]
Homepage = "https://github.com/psychobarge/pi-sessions"
Issues = "https://github.com/psychobarge/pi-sessions/issues"

[project.scripts]
pisessions = "pi_sessions.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_sessions"]

[tool.hatch.build.targets.sdist]
# optional Quarto themes — repo only, never shipped in a package
exclude = ["/extras"]
